<!DOCTYPE html>
<html lang="en">
  <div class="content">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Page 4</title>
      <link rel="stylesheet" href="../css/styles.css" />
      <link rel="stylesheet" href="../css/page4.css" />
    </head>

    <body>
      <header>
        <h1>Settings</h1>
      </header>


      <main>
        <section class="notifications-section">
          <h2>Notification Settings</h2>

          <div class="group">
            <label for="current-phone-number">Current Phone Number:</label>
            <span id="current-phone-number">1-(XXX)-XXX-XXXX</span>
          </div>
          <form id="notification-form">
            <div class="form-group">
              <label for="phone-number">Phone Number:</label>
              <input
                type="tel"
                id="phone-number"
                name="phone-number"
                placeholder="Enter your phone number"
                pattern="[0-9]{10}"
                required
              />
            </div>
            <div class="form-group">
               <input type="checkbox" name="sms-notifications" />
              <label>
                Enable SMS Notifications
              </label>
            </div>
            <button type="submit">Save Notifications</button>
          </form>
        </section>

        <section class="preferences-section">
          <h2>Preferences</h2>
          <form>
            <label for="currency">Preferred Currency:</label>
            <select id="currency" name="currency">
              <option value="usd">USD</option>
              <option value="eur">EUR</option>
              <option value="gbp">GBP</option>
            </select>
          </form>
          <form>
            <button type="submit">Update Preferences</button>
          </form>
        </section>
      </main>

     
      
      <div class="taskbar">
        <button data-page="page1">
          <img src="../public/home-svgrepo-com.svg" width="50px" style="margin-bottom: 5px" />Home
        </button>
        <button data-page="page2">
          <img src="../public/search-svgrepo-com.svg" width="40px" style="margin-bottom: 10px" />Tracker
        </button>
        <button data-page="page3">
          <img src="../public/dollar-sign-svgrepo-com.svg" width="45px" style="margin-bottom: 10px" />Goals
        </button>
        <button data-page="page4">
          <img src="../public/settings-svgrepo-com.svg" width="45px" style="margin-bottom: 10px" />Profile
        </button>
      </div>
    <script src="../js/scripts.js"></script>
    </body>
  </div>
  
  </div>
  
  </html>
